{% extends 'base.html' %}

{% block title %}Products{% endblock %}

{% block content %}
    <h1>Our Products</h1>
    <div class="products">
        {% for product in products %}
            <div class="card">
                <img src="{{ product.image }}" alt="{{ product.name }}" width="150" height="150">
                <h3>{{ product.name }}</h3>
                <p>₹{{ product.price }}</p>
                <a href="{{ url_for('product', id=product.id) }}">View Details</a>
                <br>
                <a href="{{ url_for('add_to_cart', id=product.id) }}">Add to Cart</a>
            </div>
        {% endfor %}
    </div>
{% endblock %}
