{% extends 'base.html' %}

{% block title %}Checkout{% endblock %}

{% block content %}
    <h1>Checkout</h1>
    <form method="POST">
        <label>Name:</label>
        <input type="text" name="name" required><br><br>

        <label>Address:</label>
        <textarea name="address" required></textarea><br><br>

        <button type="submit">Place Order</button>
    </form>
{% endblock %}
